[package]
name = "insearch-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false
description = "InSearch — egui desktop front-end."

[[bin]]
name = "insearch-gui"
path = "src/main.rs"

[dependencies]
insearch-core = { path = "../insearch-core", features = ["all-formats"] }
crossbeam-channel.workspace = true
# glow backend only (no wgpu/DirectX) — smaller binary, faster link, Linux-ready.
# `persistence` = restore window geometry + our saved prefs across sessions.
eframe = { version = "0.36", default-features = false, features = [
    "glow",
    "default_fonts",
    "wayland",
    "x11",
    "persistence",
] }
egui_extras = "0.36"
rfd = "0.17"
regex = "1.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Local-time formatting for the Modified column + date-filter parsing (needs
# OS timezone/DST data). `clock` pulls in the local-zone lookup only.
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# Windows-only: registry access for the Explorer context-menu integration and
# the opt-in update-check settings; WinHTTP for the update check itself (uses
# the OS HTTPS stack — no bundled HTTP/TLS library compiled in).
[target.'cfg(windows)'.dependencies]
winreg = "0.56"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Networking_WinHttp",
] }

# Windows-only: embed the app manifest (DPI awareness, common controls).
[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"
