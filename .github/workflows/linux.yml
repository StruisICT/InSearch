name: linux

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # attach assets to releases on tags

jobs:
  linux:
    name: build linux tarball
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libxcb1-dev \
            libgl1-mesa-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

      - name: Build release
        run: cargo build --release -p insearch-gui -p insearch-cli

      - name: Smoke-test CLI
        run: |
          printf 'hello ERROR world\nnothing here\n' > sample.log
          ./target/release/insearch-cli ERROR . | grep -q ERROR

      - name: Package tarball
        run: |
          mkdir -p dist
          tar -C target/release -czf "dist/InSearch-linux-x86_64.tar.gz" \
            insearch-gui insearch-cli

      - uses: actions/upload-artifact@v4
        with:
          name: insearch-linux
          path: dist/*.tar.gz

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
