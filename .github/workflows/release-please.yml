name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # Maintains a release PR from Conventional Commits; on merge it tags
      # vX.Y.Z, which triggers build.yml / linux.yml to attach release assets.
      #
      # Use a fine-grained PAT (repo secret RELEASE_PLEASE_TOKEN) so the tag it
      # creates is treated as a real push and triggers those build workflows.
      # Without the PAT it falls back to GITHUB_TOKEN — which works, but the bot
      # token can't trigger other workflows, so the tag must then be re-pushed
      # manually to attach binaries.
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
