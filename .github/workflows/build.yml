name: build

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # attach assets to releases on tags
  actions: read # SignPath downloads the build artifact via the Actions API

jobs:
  check:
    name: fmt / clippy / test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  windows:
    name: build windows exe
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release -p insearch-gui -p insearch-cli

      # ---------- Code signing (SignPath Foundation — free, forever, for OSS) ----------
      # Inert until configured: set repo variable ENABLE_SIGNING=true, the SignPath
      # org/project/policy/artifact-config variables, and the SIGNPATH_API_TOKEN secret
      # (see AGENTS.md "Code signing"). Runs only on release tags, so PR/main builds stay
      # fast and need no secrets. The exes are signed here; the MSI is built from the
      # signed exes and signed too, so the downloaded installer stops tripping SmartScreen.
      - name: Upload unsigned exes (for signing)
        id: upload_exes
        if: vars.ENABLE_SIGNING == 'true' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-exes
          path: |
            target/release/insearch-gui.exe
            target/release/insearch-cli.exe

      - name: Sign exes (SignPath)
        id: sign_exes
        if: vars.ENABLE_SIGNING == 'true' && startsWith(github.ref, 'refs/tags/v')
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_EXE_ARTIFACT_CONFIG_SLUG }}
          github-artifact-id: ${{ steps.upload_exes.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-exes

      - name: Use signed exes
        if: steps.sign_exes.outcome == 'success'
        shell: bash
        run: |
          cp signed-exes/insearch-gui.exe target/release/insearch-gui.exe
          cp signed-exes/insearch-cli.exe target/release/insearch-cli.exe

      - name: Smoke-test CLI
        shell: bash
        run: |
          printf 'hello ERROR world\nnothing here\n' > sample.log
          ./target/release/insearch-cli.exe ERROR . | grep -q ERROR

      - name: Stage artifacts
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/insearch-gui.exe "dist/InSearch.exe"
          cp target/release/insearch-cli.exe "dist/insearch-cli.exe"

      # Build the MSI only on release tags (it needs WiX + cargo-wix).
      - name: Build MSI installer
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          cargo install cargo-wix --version 0.3.9 --locked
          # WiX v3 (candle/light) is pre-installed on windows runners; install if not.
          candle=$(find "/c/Program Files (x86)" -name candle.exe 2>/dev/null | head -1 || true)
          if [ -z "$candle" ]; then choco install wixtoolset --no-progress -y; candle=$(find "/c/Program Files (x86)" -name candle.exe 2>/dev/null | head -1); fi
          binp=$(dirname "$candle")
          cargo wix -p insearch-gui --no-build -i "$ver" -b "$binp" -o "dist/InSearch-$ver-x86_64.msi"
          ls -la dist/*.msi

      # Sign the MSI too (built from the signed exes above).
      - name: Upload unsigned MSI (for signing)
        id: upload_msi
        if: vars.ENABLE_SIGNING == 'true' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-msi
          path: dist/*.msi

      - name: Sign MSI (SignPath)
        id: sign_msi
        if: vars.ENABLE_SIGNING == 'true' && startsWith(github.ref, 'refs/tags/v')
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_MSI_ARTIFACT_CONFIG_SLUG }}
          github-artifact-id: ${{ steps.upload_msi.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-msi

      - name: Use signed MSI
        if: steps.sign_msi.outcome == 'success'
        shell: bash
        run: cp signed-msi/*.msi "$(ls dist/*.msi)"

      # SHA256 checksums for the (final, possibly-signed) downloads, so users can
      # verify integrity — a cheap trust signal while the binaries are unsigned.
      - name: Checksums
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          cd dist
          sha256sum InSearch.exe insearch-cli.exe *.msi > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: insearch-windows
          path: dist/*

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.msi
            dist/SHA256SUMS.txt
