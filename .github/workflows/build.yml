name: build

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # attach assets to releases on tags

jobs:
  check:
    name: fmt / clippy / test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  windows:
    name: build windows exe
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release -p fetchy-gui -p fetchy-cli

      - name: Smoke-test CLI
        shell: bash
        run: |
          printf 'hello ERROR world\nnothing here\n' > sample.log
          ./target/release/fetchy-cli.exe ERROR . | grep -q ERROR

      - name: Stage artifacts
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/fetchy-gui.exe "dist/InspectorFetchy.exe"
          cp target/release/fetchy-cli.exe "dist/fetchy-cli.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: inspector-fetchy-windows
          path: dist/*.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
